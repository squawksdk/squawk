name: squawk
description: "Shake-to-report feedback for Flutter: an annotated screenshot, device and app info, and recent logs land in your inbox. Placeholder release; the SDK is in development."
version: 0.0.1
homepage: https://squawksdk.com
repository: https://github.com/squawksdk/squawk
issue_tracker: https://github.com/squawksdk/squawk/issues

topics:
  - feedback
  - bug-report
  - screenshot
  - logging

environment:
  sdk: ^3.6.0
  flutter: ">=3.24.0"

dependencies:
  feedback: ^3.2.0
  flutter:
    sdk: flutter
  shake_gesture: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
