name: squawk
description: "Shake-to-report feedback for Flutter: an annotated screenshot, device and app info, and recent logs land in your inbox. Placeholder release; the SDK is in development."
version: 0.0.1
homepage: https://squawksdk.com
repository: https://github.com/squawksdk/squawk
issue_tracker: https://github.com/squawksdk/squawk/issues

topics:
  - feedback
  - bug-report
  - screenshot
  - logging

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  connectivity_plus: ^7.3.1
  device_info_plus: ">=11.5.0 <14.0.0"
  flutter:
    sdk: flutter
  http: ^1.6.0
  package_info_plus: ">=8.0.0 <11.0.0"
  path_provider: ">=2.1.5 <3.0.0"
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The shake trigger is the package's own native code: the system shake
# gesture on iOS, a SensorEventListener on Android. Declaring only these
# two platforms is accurate; everything else the SDK does is pure Dart,
# and the trigger stands down gracefully elsewhere.
flutter:
  plugin:
    platforms:
      android:
        package: com.squawksdk.squawk
        pluginClass: SquawkPlugin
      ios:
        pluginClass: SquawkPlugin
